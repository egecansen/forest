<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Forest</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2016%2016'%3E%3Ctext%20y='13'%20font-size='13'%3E%F0%9F%8C%B2%3C/text%3E%3C/svg%3E" />
  <script>
    // set theme before first paint to avoid a flash
    try {
      var t = localStorage.getItem('forest-theme')
        || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.dataset.theme = t;
    } catch (e) { /* default light */ }
  </script>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header>
    <div class="brand"><span class="brand-mark">🌲</span> Forest</div>
    <div id="readout" class="readout"></div>
    <input id="search" type="search" placeholder="Filter by repo, branch, or ticket…" />
    <button id="new-wt" title="Create a worktree">+ New</button>
    <button id="fetch-all" title="git fetch all repos">Fetch all</button>
    <button id="mode-toggle" class="mode-guided" title="Toggle guided / auto">Guided</button>
    <button id="theme-toggle" title="Toggle light / dark">☾</button>
  </header>

  <main>
    <div class="cols">
      <div class="col-branch">Branch / ticket</div>
      <div class="col-status">Status</div>
      <div class="col-owner">Owner</div>
      <div class="col-agent">Agent</div>
      <div class="col-age">Age</div>
      <div class="col-size">Size</div>
      <div class="col-actions"></div>
    </div>
    <div id="table" class="table"></div>
  </main>

  <aside id="drawer" class="drawer hidden"></aside>
  <div id="drawer-resize" title="Drag to resize"></div>

  <section id="journal" class="journal">
    <div class="journal-head" id="journal-toggle" title="Collapse / expand">
      <span class="jc-caret">▾</span> Command journal<span class="jc-count" id="journal-count"></span>
    </div>
    <ul id="journal-list"></ul>
  </section>

  <div id="palette" class="palette hidden">
    <input id="palette-input" type="text" placeholder="Jump to worktree or action…" />
    <ul id="palette-list"></ul>
  </div>

  <div id="newwt" class="modal hidden">
    <div class="modal-card">
      <h3>New worktree</h3>
      <label>Repository
        <select id="nw-repo"></select>
      </label>
      <label>Branch / ticket
        <input id="nw-branch" type="text" placeholder="tech/SUI-99999" autocomplete="off" spellcheck="false" />
      </label>
      <label class="row-inline">
        <input id="nw-newbranch" type="checkbox" checked /> Create a new branch
      </label>
      <label>Base <span class="hint">— optional, defaults to the repo's current HEAD</span>
        <input id="nw-base" type="text" placeholder="master" autocomplete="off" spellcheck="false" />
      </label>
      <div class="modal-actions">
        <button id="nw-cancel" class="btn-ghost">Cancel</button>
        <button id="nw-create" class="btn-accent">Create</button>
      </div>
    </div>
  </div>

  <div id="finishwt" class="modal hidden">
    <div class="modal-card">
      <h3>Finish worktree</h3>
      <p id="fw-summary" class="hint"></p>
      <div id="fw-namechoice" class="hidden">
        <label class="row-inline"><input type="radio" name="fw-name" id="fw-name-branch" checked /> <span id="fw-name-branch-label"></span></label>
        <label class="row-inline"><input type="radio" name="fw-name" id="fw-name-wt" /> <span id="fw-name-wt-label"></span></label>
      </div>
      <label class="row-inline"><input id="fw-remove" type="checkbox" checked /> Remove worktree after landing</label>
      <div class="modal-actions">
        <button id="fw-cancel" class="btn-ghost">Cancel</button>
        <button id="fw-go" class="btn-accent">Finish</button>
      </div>
    </div>
  </div>

  <div id="picker" class="modal hidden">
    <div class="modal-card picker-card">
      <h3>Start a Claude session</h3>
      <p class="picker-sub" id="pk-sub"></p>
      <div id="pk-body" class="pk-body"></div>
      <div class="modal-actions">
        <span id="pk-count" class="pk-count"></span>
        <button id="pk-cancel" class="btn-ghost">Cancel</button>
        <button id="pk-start" class="btn-accent">Start session</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script type="module" src="/app.js"></script>
</body>
</html>
